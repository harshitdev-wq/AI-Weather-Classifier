name: CI

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Python syntax
        run: python -m compileall -q train.py evaluate.py predict.py api backend

      - name: Check frontend JavaScript syntax
        run: node --check frontend/script.js

      - name: Validate Vercel configuration
        run: python -m json.tool vercel.json > /dev/null
